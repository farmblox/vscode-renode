<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Source for images/icon.png. Render with:
       rsvg-convert -w 256 -h 256 images/icon.svg -o images/icon.png

       A package with pins, holding a small node graph: a platform description declares
       peripherals and wires them together. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2836"/>
      <stop offset="1" stop-color="#101A24"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3B4D"/>
      <stop offset="1" stop-color="#1E2C3A"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Pins, four to a side. -->
  <g fill="#3FC1F3">
    <rect x="73"  y="46"  width="14" height="22" rx="4"/>
    <rect x="105" y="46"  width="14" height="22" rx="4"/>
    <rect x="137" y="46"  width="14" height="22" rx="4"/>
    <rect x="169" y="46"  width="14" height="22" rx="4"/>

    <rect x="73"  y="188" width="14" height="22" rx="4"/>
    <rect x="105" y="188" width="14" height="22" rx="4"/>
    <rect x="137" y="188" width="14" height="22" rx="4"/>
    <rect x="169" y="188" width="14" height="22" rx="4"/>

    <rect x="46"  y="73"  width="22" height="14" rx="4"/>
    <rect x="46"  y="105" width="22" height="14" rx="4"/>
    <rect x="46"  y="137" width="22" height="14" rx="4"/>
    <rect x="46"  y="169" width="22" height="14" rx="4"/>

    <rect x="188" y="73"  width="22" height="14" rx="4"/>
    <rect x="188" y="105" width="22" height="14" rx="4"/>
    <rect x="188" y="137" width="22" height="14" rx="4"/>
    <rect x="188" y="169" width="22" height="14" rx="4"/>
  </g>

  <!-- Package body. -->
  <rect x="64" y="64" width="128" height="128" rx="18"
        fill="url(#die)" stroke="#3FC1F3" stroke-width="7"/>

  <!-- Orientation mark. -->
  <circle cx="86" cy="86" r="7" fill="#3FC1F3" opacity="0.75"/>

  <!-- Node graph: one declaration wired to two others. -->
  <g stroke="#F5F9FC" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="108" x2="103" y2="152"/>
    <line x1="128" y1="108" x2="153" y2="152"/>
  </g>
  <g fill="#F5F9FC">
    <circle cx="128" cy="106" r="13"/>
    <circle cx="102" cy="154" r="13"/>
    <circle cx="154" cy="154" r="13"/>
  </g>
</svg>
